<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flouci Payment Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    h1 {
      color: #333;
    }
    pre {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
    }
    .btn {
      display: inline-block;
      padding: 10px 15px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      margin-top: 20px;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background-color: #45a049;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background-color: #f9f9f9;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Flouci Payment Test</h1>
    
    <div>
      <h2>Create New Payment</h2>
      <form id="payment-form">
        <div class="form-group">
          <label for="amount">Amount (TND)</label>
          <input type="number" id="amount" value="10" min="1" step="1">
        </div>
        
        <div class="form-group">
          <label for="note">Note</label>
          <input type="text" id="note" value="Test donation">
        </div>
        
        <button type="submit" class="btn">Create Payment</button>
      </form>
    </div>
    
    <div class="result" id="result" style="display: none;">
      <h3>Payment Created</h3>
      <pre id="payment-details"></pre>
      <a id="payment-link" href="#" target="_blank" class="btn">Open Payment Page</a>
    </div>
  </div>

  <script>
    document.getElementById('payment-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const amount = document.getElementById('amount').value;
      const note = document.getElementById('note').value;
      
      const resultDiv = document.getElementById('result');
      const detailsDiv = document.getElementById('payment-details');
      const linkBtn = document.getElementById('payment-link');
      
      resultDiv.style.display = 'block';
      detailsDiv.textContent = 'Creating payment...';
      
      try {
        // Call our API to create a payment
        const response = await fetch('/api/payment/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            amount: parseFloat(amount),
            note: note,
            order_id: `test_${Date.now()}`
          }),
        });
        
        const data = await response.json();
        
        detailsDiv.textContent = JSON.stringify(data, null, 2);
        
        if (data.success && data.payment_url) {
          linkBtn.href = data.payment_url;
        } else {
          throw new Error('Payment creation failed');
        }
      } catch (error) {
        detailsDiv.textContent = `Error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
