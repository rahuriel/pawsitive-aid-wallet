<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Flouci Payment Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    h1 {
      color: #333;
    }
    pre {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
    }
    .btn {
      display: inline-block;
      padding: 10px 15px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      margin-top: 20px;
      cursor: pointer;
      border: none;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #45a049;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background-color: #f9f9f9;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Direct Flouci Payment Test</h1>
    <p>This page will help test direct payment links to Flouci.</p>
    
    <div class="form-group">
      <label for="amount">Amount (TND)</label>
      <input type="number" id="amount" value="25" min="1" step="1">
    </div>
    
    <button id="generate-link" class="btn">Generate Payment Link</button>
    
    <div id="result" class="result" style="display: none;">
      <h2>Payment Link</h2>
      <p id="payment-link"></p>
      <a id="payment-link-btn" href="#" target="_blank" class="btn">Open Payment Link</a>
    </div>
    
    <div style="margin-top: 30px;">
      <h2>Test Direct Links</h2>
      <p>Click one of these direct links to test Flouci payment:</p>
      <ul>
        <li><a href="https://flouci.com/pay/PJ2DodvTS4GhkiovPLKgRQ" target="_blank">Test Link 1 (from server logs)</a></li>
        <li><a href="https://developers.flouci.com/api/generate_payment" target="_blank">Flouci API Documentation</a></li>
      </ul>
    </div>
    
    <div style="margin-top: 30px;">
      <a href="/" class="btn" style="background-color: #6c757d;">Back to Home</a>
    </div>
  </div>

  <script>
    document.getElementById('generate-link').addEventListener('click', function() {
      const amount = document.getElementById('amount').value;
      const paymentId = `manual_payment_${Date.now()}`;
      
      // This is just a direct link to the Flouci payment page
      // In a real implementation, this would be generated by the Flouci API
      const paymentLink = `https://flouci.com/pay/${paymentId}`;
      
      // Display the payment link
      document.getElementById('payment-link').textContent = paymentLink;
      document.getElementById('payment-link-btn').href = paymentLink;
      document.getElementById('result').style.display = 'block';
    });
  </script>
</body>
</html>
